
services:

  embeddingservice:
    image: ${DOCKER_USERNAME}/embeddingservice:latest
    container_name: embeddingservice
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - chatbot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  langchainservice:
    image: ${DOCKER_USERNAME}/langchainservice:latest
    container_name: langchainservice
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o-mini
      EMBEDDING_URL: http://embeddingservice:8001/embed
      BACKEND_BASE_URL: http://councilchatbot:8080
    ports:
      - "8010:8010"
    restart: unless-stopped
    networks:
      - chatbot-net
    depends_on:
      embeddingservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  councilchatbot:
    image: ${DOCKER_USERNAME}/councilchatbot:latest
    container_name: councilchatbot
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      EmbeddingService__BaseUrl: http://embeddingservice:8001
      LangChain__BaseUrl: http://langchainservice:8010
      Playwright__TargetUrl: https://onlineforms.bradford.gov.uk/ufs/collectiondates.eb
      Playwright__Headless: "true"
      Playwright__WaitAfterSubmitMs: "2000"
    depends_on:
      embeddingservice:
        condition: service_healthy
      langchainservice:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-net
    volumes:
      - chatbot_logs:/app/Logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  chatbot_logs:

networks:
  chatbot-net:
    driver: bridge